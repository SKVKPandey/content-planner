{% extends "base.html" %}

{% block title %}Calendar{% endblock %}

{% block content %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.2.0/fullcalendar.min.css">
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/styles.css') }}">
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/calendar_view.css') }}">

<div id="nav-panel" class="nav-panel" style="display: none;">
    <span id="close-nav-panel" class="close-nav-panel">X</span>
    <h2>Event Details</h2>
    <div id="event-details"></div>
</div>

<div style="margin-top: 40px;" class="submain">
    <div id="calendar">
        <div class="icon-row">
            <div id="add-schedule">
                <button onclick="contentPlanner()">Add Schedule</button>
            </div>
            <div id="select-toolbar">
                <button>Select</button>
            </div>
            <div id="icon-toolbar">
                <button id="gen-window">GenWindow</button>
                <i class="fas fa-edit icon-button" id="edit-icon" title="Edit Event"></i>
            </div>
        </div>
    </div>
</div>

<!-- Dialog Box -->
<div id="dialog-box" class="dialog-overlay" style="display: none;">
    <div class="dialog-content">
        <h3>Content Preferences</h3>
        <p>Please provide your preferences for the content to be generated:</p>
        <form id="preferences-form">
            <!-- Tone Selection -->
            <label for="tone">Select Tone:</label>
            <select id="tone" name="tone" required>
                <option value="formal">Formal</option>
                <option value="informal">Informal</option>
                <option value="friendly">Friendly</option>
                <option value="professional">Professional</option>
            </select>
            <br><br>

            <!-- Language Selection -->
            <label for="language">Select Language:</label>
            <select id="language" name="language" required>
                <option value="english">English</option>
                <option value="hindi">Hindi</option>
                <option value="spanish">Spanish</option>
                <option value="french">French</option>
            </select>
            <br><br>

            <!-- Emoji Inclusion -->
            <label for="include-emoji">Include Emojis:</label>
            <input type="checkbox" id="include-emoji" name="include-emoji">
            <br><br>

            <!-- Image Inclusion -->
            <label for="include-emoji">Include Image:</label>
            <input type="checkbox" id="include-emoji" name="include-emoji">
            <br><br>

            <!-- Formality Slider -->
            <label for="formality-level">Formality Level:</label>
            <input type="range" id="formality-level" name="formality-level" min="1" max="10" value="5">
            <span id="formality-value">5</span> <!-- Display current formality level -->
            <br><br>

            <!-- Word Count -->
            <label for="word-count">Preferred Word Count:</label>
            <input type="number" id="word-count" name="word-count" min="100" max="2000" placeholder="200">
            <br><br>

            <!-- Submit and Cancel Buttons -->
            <button type="submit" id="submit-preferences">Submit</button>
            <button type="submit" id="cancel-preferences">Cancel</button>
        </form>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.2.0/fullcalendar.min.js"></script>

{% endblock %}
