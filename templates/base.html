    <style>
        .hero-section {
            position: relative;
            background-image: url('../static/images/hero-bg.jpg');
            background-size: cover;
            background-position: center;
            color: #fff;
            text-align: center;
            padding: 5em;
            height: 100vh; /* Set height to 100% of the viewport height */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .profile-link {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none; /* Removes underline from the anchor */
        }        
    </style>

</head>

<body>
    <div id="loading-logo">
        <img src="../static/images/logo.jpg" alt="Likhlo AI" class="logo"> 
    </div>
        <nav>
            <div class="navbar-brand">
                <img src="../static/images/logo.jpg" alt="Likhlo AI">
                <b>Likhlo AI</b>
            </div>
            <div class="navbar-toggle" id="navbarToggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="navbar-links" id="navbarLinks">
                <a href="/#hero">Home</a>
                <a href="/#tools">Applications</a>
                <a id="loginBtn" href="/login" target="_blank">Login&nbsp;<i class="fa-solid fa-arrow-up-right-from-square"></i></a>
                <!-- <div id="profileImageDiv" class="profile-img">
                    <img id="profileImage" src="" alt="Profile Image" style="width: 50px; height: 50px; border-radius: 50%;">
                </div> -->
                <div id="profileImageDiv" class="profile-img">
                    <img id="profileImage" src="" alt="Profile Image" style="width: 50px; height: 50px; border-radius: 50%;">
                    <div class="tooltip" id="logoutTooltip">Logout&nbsp;<i class="fa-solid fa-arrow-up-right-from-square"></i></div>
                </div>                
                <script>
                    // Retrieve profile image from localStorage
                    const profileImage = localStorage.getItem('profileImage');
                    if (profileImage) {
                        document.getElementById('loginBtn').style.display = "none";
                        document.getElementById('profileImageDiv').style.display = "flex";
                        document.getElementById('profileImage').src = profileImage;
                    } 
                    else {
                        document.getElementById('profileImageDiv').style.display = "none";
                        document.getElementById('loginBtn').style.display = "flex";
                    }
                    document.addEventListener('DOMContentLoaded', function () {
                const profileImage = document.getElementById('profileImage');
                const tooltip = document.getElementById('logoutTooltip');
                let isTooltipVisible = false;

                // Toggle tooltip visibility on profile image click
                profileImage.addEventListener('click', function (event) {
                    isTooltipVisible = !isTooltipVisible;
                    tooltip.classList.toggle('visible', isTooltipVisible);

                    // Prevent click from propagating to document
                    event.stopPropagation();
                });

                // Redirect to logout on tooltip click
                tooltip.addEventListener('click', function () {
                    logout()
                    localStorage.clear();
                    window.location.href = '/logout'; // Replace with your logout route
                });

                // Hide the tooltip when clicking outside
                document.addEventListener('click', function () {
                    if (isTooltipVisible) {
                        tooltip.classList.remove('visible');
                        isTooltipVisible = false;
                    }
                });

                // Prevent click inside tooltip from hiding it
                tooltip.addEventListener('click', function (event) {
                    event.stopPropagation();
                });
            });
                </script>
            </div>
        </nav>

        <!-- Main Content -->
        <main id="main-content" style="display: none;">
            {% block content %}
            <!-- Dynamic content goes here -->
            {% endblock %}
        </main>

        <!-- Footer Section -->
        <footer>
            <div style="text-align: center; margin-top: 15px; margin-bottom: 10px;">
                <p>&copy; 2024 Likhlo AI. All rights reserved. Developed by SKVK Pandey.</p>
            </div>
        </footer>   
</body>
</html>
